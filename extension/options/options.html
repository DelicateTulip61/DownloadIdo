<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DownloadIdo settings</title>
<link rel="stylesheet" href="../ui/theme.css">
<link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <div class="brand"><img src="../icons/icon32.png" alt="">DownloadIdo settings</div>

    <form id="form" autocomplete="off">
      <div class="field">
        <label for="folder">Save into folder</label>
        <input id="folder" name="folder" type="text" maxlength="120" spellcheck="false">
        <p class="hint">Inside your browser's download folder. Files go to <code id="preview">Downloads/DownloadIdo/</code></p>
      </div>

      <div class="field row">
        <input id="saveAs" name="saveAs" type="checkbox">
        <label for="saveAs">Ask where to save each file
          <span class="hint">"Download all" always saves without asking, so it doesn't open one window per file.</span>
        </label>
      </div>

      <fieldset class="field">
        <legend>MP3 quality</legend>
        <div class="choices">
          <label><input type="radio" name="mp3Kbps" value="128"> 128 kbps <span class="hint">smaller</span></label>
          <label><input type="radio" name="mp3Kbps" value="192"> 192 kbps <span class="hint">default</span></label>
          <label><input type="radio" name="mp3Kbps" value="320"> 320 kbps <span class="hint">best</span></label>
        </div>
      </fieldset>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="../lib/utils.js"></script>
  <script src="options.js"></script>
</body>
</html>
