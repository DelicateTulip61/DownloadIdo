<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DownloadIdo fixtures</title>
<style>
  body { margin: 0; display: grid; grid-template-columns: repeat(4, 260px); gap: 10px; padding: 10px; }
  .cell { position: relative; width: 260px; height: 200px; overflow: hidden; }
  .cell img, .cell video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover { position: absolute; inset: 0; background: transparent; }
  .bg { background: url("/media/bg.jpg") center / cover; }
  .pseudo::before { content: ''; position: absolute; inset: 0; background-image: url('/media/pseudo.jpg'); }
  .nope img { pointer-events: none; }
  .play { position: absolute; left: 110px; top: 80px; width: 40px; height: 40px; background: url("/media/tiny.png") center / contain; }
  iframe { border: 0; width: 260px; height: 200px; }
</style>
</head>
<body>
  <div class="cell" id="plain"><img src="/media/plain.png" alt=""></div>
  <div class="cell" id="srcset"><img src="/media/small.jpg" srcset="/media/small.jpg 320w, /media/big.jpg 1280w" sizes="100px" alt=""></div>
  <div class="cell" id="picture"><picture><source srcset="/media/pic-big.jpg 1600w" sizes="10px"><img src="/media/pic-small.jpg" alt=""></picture></div>
  <div class="cell" id="overlay"><img src="/media/overlay.jpg" alt=""><div class="cover"></div></div>
  <div class="cell nope" id="pe-none"><img src="/media/pe-none.jpg" alt=""></div>
  <div class="cell bg" id="bg"></div>
  <div class="cell pseudo" id="pseudo"></div>
  <div class="cell" id="shadow"></div>
  <iframe id="frame" src="http://127.0.0.1:__PORT__/iframe.html"></iframe>
  <div class="cell" id="lazy"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="/media/lazy.jpg" alt=""></div>
  <div class="cell" id="linked"><a href="/media/linked-full.jpg"><img src="/media/linked-thumb.jpg" alt=""></a></div>
  <div class="cell" id="noext"><img src="/noext/photo" alt=""></div>
  <div class="cell" id="hot"><img src="http://127.0.0.1:__PORT__/protected/hot.jpg" alt=""></div>
  <div class="cell" id="mp4"><video src="/media/clip.mp4" muted></video><div class="play"></div></div>
  <div class="cell" id="blobimg"><img id="blobimg-img" alt=""></div>
  <div class="cell" id="aud"><audio src="/media/tone.m4a" controls style="width:100%"></audio></div>
  <div class="cell" id="audmp3"><audio src="/media/tone.mp3" controls style="width:100%"></audio></div>
  <div class="cell" id="wp"><img src="/wp-content/uploads/wpfull-300x200.jpg" alt=""></div>
  <div class="cell" id="wpgone"><img src="/wp-content/uploads/wpgone-300x200.jpg" alt=""></div>
  <div class="cell" id="empty"></div>
  <img id="tiny" src="/media/tiny.png" alt="" style="width:16px;height:16px">
  <script>
    fetch('/media/plain.png').then((r) => r.blob()).then((b) => { document.getElementById('blobimg-img').src = URL.createObjectURL(b); });
    const host = document.getElementById('shadow');
    host.attachShadow({ mode: 'open' }).innerHTML =
      '<img src="/media/shadow.jpg" style="width:260px;height:200px;display:block" alt="">';
  </script>
</body>
</html>
